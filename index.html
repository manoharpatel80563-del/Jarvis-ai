<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS V4</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#18233d 0%,#070b14 45%,#020307 100%);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.container{
  width:100%;
  max-width:430px;
  min-height:700px;
  background:rgba(8,13,25,.88);
  border:1px solid rgba(0,200,255,.35);
  border-radius:28px;
  padding:24px;
  box-shadow:
    0 0 35px rgba(0,180,255,.15),
    inset 0 0 30px rgba(0,180,255,.04);
  text-align:center;
}

h1{
  font-size:48px;
  letter-spacing:7px;
  color:#00d9ff;
  text-shadow:0 0 18px #00d9ff;
}

.version{
  color:#7f91a8;
  font-size:13px;
  letter-spacing:3px;
  margin-top:5px;
}

.status{
  margin:22px 0;
  padding:12px;
  border-radius:14px;
  background:rgba(0,255,150,.06);
  border:1px solid rgba(0,255,150,.25);
  color:#62ffb0;
  font-size:14px;
}

.status.listening{
  color:#00d9ff;
  border-color:#00d9ff;
  box-shadow:0 0 18px rgba(0,217,255,.3);
}

.mic{
  width:145px;
  height:145px;
  margin:25px auto;
  border-radius:50%;
  border:2px solid #00d9ff;
  background:radial-gradient(circle,#123044,#06101a);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:65px;
  box-shadow:0 0 25px rgba(0,217,255,.3);
  transition:.2s;
  user-select:none;
}

.mic:active{
  transform:scale(.94);
}

.mic.listening{
  animation:pulse 1s infinite;
  border-color:#00ffae;
  box-shadow:
    0 0 25px #00ffae,
    0 0 60px rgba(0,255,174,.25);
}

@keyframes pulse{
  50%{
    transform:scale(1.07);
  }
}

.label{
  color:#71849b;
  font-size:12px;
  letter-spacing:2px;
  margin-bottom:8px;
}

.box{
  min-height:55px;
  padding:15px;
  border-radius:14px;
  background:#090f1c;
  border:1px solid #17283b;
  margin-bottom:14px;
  line-height:1.5;
  word-wrap:break-word;
}

.response{
  color:#00e5ff;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

button{
  border:1px solid #1b536b;
  background:#091622;
  color:#d8f8ff;
  padding:13px 8px;
  border-radius:12px;
  font-size:14px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
  background:#103044;
}

.footer{
  margin-top:20px;
  color:#536579;
  font-size:11px;
}
</style>
</head>

<body>

<div class="container">

  <h1>JARVIS</h1>
  <div class="version">AI VOICE ASSISTANT • V4</div>

  <div id="status" class="status">
    🟢 READY — Mic दबाकर बोलिए
  </div>

  <div
    id="mic"
    class="mic"
    onclick="startListening()">
    🎙️
  </div>

  <div class="label">LATEST COMMAND</div>
  <div id="commandBox" class="box">
    कोई command नहीं
  </div>

  <div class="label">JARVIS RESPONSE</div>
  <div id="responseBox" class="box response">
    नमस्ते! मैं JARVIS V4 हूँ।
  </div>

  <div class="buttons">
    <button onclick="quickCommand('समय बताओ')">🕐 समय</button>
    <button onclick="quickCommand('आज की तारीख बताओ')">📅 तारीख</button>
    <button onclick="quickCommand('battery बताओ')">🔋 Battery</button>
    <button onclick="quickCommand('internet बताओ')">🌐 Internet</button>
    <button onclick="quickCommand('google खोलो')">🔎 Google</button>
    <button onclick="quickCommand('youtube खोलो')">▶️ YouTube</button>
    <button onclick="quickCommand('whatsapp खोलो')">💬 WhatsApp</button>
    <button onclick="quickCommand('help')">❓ Help</button>
  </div>

  <div class="footer">
    JARVIS V4 • Mobile Voice AI
  </div>

</div>

<script>

/* =========================
   VOICE RECOGNITION
========================= */

let recognition;
let listening = false;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition){

  recognition = new SpeechRecognition();

  recognition.lang = "hi-IN";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  recognition.onstart = function(){

    listening = true;

    document.getElementById("mic")
      .classList.add("listening");

    document.getElementById("status").className =
      "status listening";

    document.getElementById("status").innerText =
      "🔵 LISTENING — बोलिए JARVIS सुन रहा है";

  };


  recognition.onresult = function(event){

    const text =
      event.results[0][0].transcript;

    document.getElementById("commandBox")
      .innerText = text;

    processCommand(text);

  };


  recognition.onerror = function(event){

    listening = false;

    document.getElementById("mic")
      .classList.remove("listening");

    document.getElementById("status").className =
      "status";

    if(event.error === "not-allowed"){

      reply(
        "Microphone permission बंद है। Browser settings में microphone permission allow करें।"
      );

    }

    else if(event.error === "no-speech"){

      reply("मुझे आपकी आवाज़ सुनाई नहीं दी। दोबारा बोलिए।");

    }

    else{

      reply("Voice recognition में समस्या आई। दोबारा try करें।");

    }

  };


  recognition.onend = function(){

    listening = false;

    document.getElementById("mic")
      .classList.remove("listening");

    document.getElementById("status").className =
      "status";

    document.getElementById("status").innerText =
      "🟢 READY — Mic दबाकर बोलिए";

  };

}


/* =========================
   START MICROPHONE
========================= */

function startListening(){

  if(!recognition){

    reply(
      "इस browser में voice recognition support नहीं है। Chrome browser इस्तेमाल करें।"
    );

    return;
  }

  if(listening){

    try{
      recognition.stop();
    }catch(e){}

    return;
  }

  try{

    recognition.start();

  }catch(error){

    reply(
      "Mic start नहीं हो पाया। एक बार फिर mic दबाइए।"
    );

  }

}


/* =========================
   SPEAK
========================= */

function speak(text){

  if(!("speechSynthesis" in window)){
    return;
  }

  window.speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(text);

  voice.lang = "hi-IN";

  voice.rate = 0.95;

  voice.pitch = 1;

  voice.volume = 1;

  window.speechSynthesis.speak(voice);

}


/* =========================
   RESPONSE
========================= */

function reply(text){

  document.getElementById("responseBox")
    .innerText = text;

  speak(text);

}


/* =========================
   TIME
========================= */

function tellTime(){

  const now = new Date();

  let hours = now.getHours();

  const minutes =
    String(now.getMinutes()).padStart(2,"0");

  let period = "AM";

  if(hours >= 12){
    period = "PM";
  }

  let displayHours = hours % 12;

  if(displayHours === 0){
    displayHours = 12;
  }

  reply(
    "अभी समय " +
    displayHours +
    " बजकर " +
    minutes +
    " मिनट " +
    period +
    " है।"
  );

}


/* =========================
   DATE
========================= */

function tellDate(){

  const now = new Date();

  const days = [
    "रविवार",
    "सोमवार",
    "मंगलवार",
    "बुधवार",
    "गुरुवार",
    "शुक्रवार",
    "शनिवार"
  ];

  const day =
    days[now.getDay()];

  const date =
    now.getDate();

  const month =
    now.getMonth() + 1;

  const year =
    now.getFullYear();

  reply(
    "आज " +
    day +
    " है। तारीख " +
    date +
    "/" +
    month +
    "/" +
    year +
    " है।"
  );

}


/* =========================
   BATTERY
========================= */

async function tellBattery(){

  if(!("getBattery" in navigator)){

    reply(
      "इस browser में battery information उपलब्ध नहीं है।"
    );

    return;
  }

  try{

    const battery =
      await navigator.getBattery();

    const level =
      Math.round(battery.level * 100);

    let message =
      "आपके फोन की battery " +
      level +
      " प्रतिशत है।";

    if(battery.charging){

      message +=
        " अभी phone charging पर है।";

    }else{

      message +=
        " अभी phone charging पर नहीं है.";

    }

    reply(message);

  }catch(error){

    reply(
      "Battery information प्राप्त नहीं हो सकी।"
    );

  }

}


/* =========================
   INTERNET
========================= */

function tellInternet(){

  if(navigator.onLine){

    reply(
      "Internet connection अभी online है।"
    );

  }else{

    reply(
      "Internet connection अभी offline है।"
    );

  }

}


/* =========================
   COMMAND PROCESSOR
========================= */

function processCommand(text){

  const command =
    text.toLowerCase().trim();


  /* HELLO */

  if(
    command.includes("hello") ||
    command.includes("हेलो") ||
    command.includes("हैलो") ||
    command.includes("नमस्ते") ||
    command.includes("jarvis")
  ){

    reply(
      "नमस्ते! मैं JARVIS V4 हूँ। बताइए मैं आपकी क्या मदद करूँ?"
    );

  }


  /* TIME */

  else if(
    command.includes("time") ||
    command.includes("समय") ||
    command.includes("टाइम") ||
    command.includes("बजे")
  ){

    tellTime();

  }


  /* BATTERY */

  else if(
    command.includes("battery") ||
    command.includes("बैटरी") ||
    command.includes("चार्ज") ||
    command.includes("charge")
  ){

    tellBattery();

  }


  /* INTERNET */

  else if(
    command.includes("internet") ||
    command.includes("इंटरनेट") ||
    command.includes("नेट") ||
    command.includes("net")
  ){

    tellInternet();

  }


  /* DATE */

  else if(
    command.includes("date") ||
    command.includes("तारीख") ||
    command.includes("दिनांक") ||
    command.includes("आज की तारीख")
  ){

    tellDate();

  }


  /* YOUTUBE SEARCH */

  else if(
    command.includes("youtube") ||
    command.includes("यूट्यूब")
  ){

    let search =
      command
      .replace(/youtube|यूट्यूब/gi,"")
      .replace(
        /पर|में|खोलो|खोलना|search|सर्च/gi,
        ""
      )
      .trim();


    if(search.length > 0){

      reply(
        "YouTube पर " +
        search +
        " search कर रहा हूँ।"
      );

      setTimeout(function(){

        window.location.href =
          "https://www.youtube.com/results?search_query=" +
          encodeURIComponent(search);

      },700);

    }

    else{

      reply("YouTube खोल रहा हूँ।");

      setTimeout(function(){

        window.location.href =
          "https://www.youtube.com/";

      },700);

    }

  }


  /* GOOGLE SEARCH */

  else if(
    command.includes("google") ||
    command.includes("गूगल")
  ){

    let search =
      command
      .replace(/google|गूगल/gi,"")
      .replace(
        /पर|में|खोलो|खोलना|search|सर्च/gi,
        ""
      )
      .trim();


    if(search.length > 0){

      reply(
        "Google पर " +
        search +
        " search कर रहा हूँ।"
      );

      setTimeout(function(){

        window.location.href =
          "https://www.google.com/search?q=" +
          encodeURIComponent(search);

      },700);

    }

    else{

      reply("Google खोल रहा हूँ।");

      setTimeout(function(){

        window.location.href =
          "https://www.google.com/";

      },700);

    }

  }


  /* WHATSAPP */

  else if(
    command.includes("whatsapp") ||
    command.includes("व्हाट्सएप")
  ){

    reply("WhatsApp खोल रहा हूँ।");

    setTimeout(function(){

      window.location.href =
        "https://web.whatsapp.com/";

    },700);

  }


  /* HELP */

  else if(
    command.includes("help") ||
    command.includes("मदद") ||
    command.includes("क्या कर सकते") ||
    command.includes("क्या क्या")
  ){

    reply(
      "आप मुझसे समय, तारीख, battery, internet status, Google search, YouTube search और WhatsApp खोलने के लिए बोल सकते हैं।"
    );

  }


  /* UNKNOWN */

  else{

    reply(
      "आपने कहा: " +
      text +
      ". यह command अभी मेरे अंदर उपलब्ध नहीं है।"
    );

  }

}


/* =========================
   QUICK BUTTON
========================= */

function quickCommand(text){

  document.getElementById("commandBox")
    .innerText = text;

  processCommand(text);

}


/* =========================
   ONLINE / OFFLINE EVENTS
========================= */

window.addEventListener(
  "online",
  function(){

    document.getElementById("status")
      .innerText =
      "🟢 INTERNET ONLINE";

  }
);


window.addEventListener(
  "offline",
  function(){

    document.getElementById("status")
      .innerText =
      "🔴 INTERNET OFFLINE";

  }
);

</script>

</body>
</html>
